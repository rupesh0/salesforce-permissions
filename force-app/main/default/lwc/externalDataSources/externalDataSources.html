<template>
  <div style="position: relative">
    <lightning-spinner
      lwc:if={isLoading}
      alternative-text="Loading"
      size="medium"
      variant="base"
    ></lightning-spinner>

    <div lwc:if={error}>
      <c-illustration
        title="Failed to fetch data"
        sub-title={error}
      ></c-illustration>
    </div>

    <div lwc:elseif={hasNoRecords}>
      <c-illustration
        title="No External Data Sources Found"
        sub-title="No external data sources match the selected filter criteria."
      ></c-illustration>
    </div>

    <div lwc:else style="height: 450px">
      <lightning-datatable
        key-field="externalDataSourceId"
        data={filteredRecords}
        columns={columns}
        hide-checkbox-column
        show-row-number-column
      ></lightning-datatable>
    </div>
  </div>
</template>
