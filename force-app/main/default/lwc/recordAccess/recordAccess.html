<template>
  <div class="slds-card record-access-container slds-m-around_medium">
    <!-- Header Banner -->
    <div class="slds-p-around_medium header-panel">
      <div class="slds-grid slds-grid_vertical-align-center">
        <div class="slds-m-right_medium header-icon">
          <lightning-icon
            icon-name="standard:record_lookup"
            size="medium"
            variant="inverse"
          ></lightning-icon>
        </div>
        <div class="slds-col">
          <h1
            class="slds-text-heading_medium slds-text-color_default"
            style="font-weight: 700"
          >
            Record Access & Sharing Inspector
          </h1>
          <p class="slds-text-body_small slds-text-color_weak">
            Select an sObject, pick records, choose target users, and analyze
            Read/Edit permissions alongside detailed sharing explanations.
          </p>
        </div>
      </div>
    </div>

    <!-- Selection Grid -->
    <div class="slds-p-around_medium">
      <div class="slds-grid slds-gutters slds-wrap">
        <!-- Step 1: sObject Selector -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small"
        >
          <div class="selection-box">
            <div
              class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
            >
              <lightning-icon
                icon-name="utility:database"
                size="x-small"
                class="slds-m-right_x-small"
              ></lightning-icon>
              <span class="section-title">1. Select sObject</span>
            </div>
            <lightning-combobox
              name="sObjectPicker"
              label="sObject"
              variant="label-hidden"
              value={selectedSObject}
              placeholder="Choose sObject..."
              options={sObjectOptions}
              onchange={handleSObjectChange}
              disabled={isSObjectsLoading}
            ></lightning-combobox>
            <div
              class="slds-m-top_xx-small slds-text-color_weak slds-text-body_extra-small"
            >
              Currently inspecting:
              <strong>{selectedSObjectLabel}</strong> ({selectedSObject})
            </div>
          </div>
        </div>

        <!-- Step 2: Record Selector -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small"
        >
          <div class="selection-box">
            <div
              class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_x-small"
            >
              <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-icon
                  icon-name="utility:record"
                  size="x-small"
                  class="slds-m-right_x-small"
                ></lightning-icon>
                <span class="section-title">2. Select Records</span>
              </div>
              <template lwc:if={hasSelectedRecords}>
                <span class="slds-badge slds-theme_info"
                  >{selectedRecordsCount} selected</span
                >
              </template>
            </div>

            <!-- Search input with dropdown -->
            <div class="slds-is-relative">
              <lightning-input
                type="search"
                variant="label-hidden"
                placeholder={recordSearchPlaceholder}
                value={recordSearchTerm}
                oninput={handleRecordSearchInput}
                onfocus={handleRecordFocus}
                onblur={handleRecordBlur}
                is-loading={isRecordSearching}
              ></lightning-input>

              <template lwc:if={showRecordDropdown}>
                <div class="dropdown-results">
                  <template lwc:if={recordSearchResults.length}>
                    <template for:each={recordSearchResults} for:item="rec">
                      <div
                        key={rec.id}
                        class="dropdown-item slds-grid slds-grid_vertical-align-center"
                        data-id={rec.id}
                        onmousedown={handleSelectRecord}
                      >
                        <lightning-icon
                          icon-name="standard:record"
                          size="small"
                          class="slds-m-right_small"
                        ></lightning-icon>
                        <div class="slds-col slds-truncate">
                          <div
                            class="slds-text-body_regular slds-truncate font-weight-600"
                          >
                            {rec.name}
                          </div>
                          <div
                            class="slds-text-body_extra-small slds-text-color_weak"
                          >
                            {rec.sObjectLabel} &bull;
                            <span class="mono-font">{rec.id}</span>
                          </div>
                        </div>
                      </div>
                    </template>
                  </template>
                  <template lwc:else>
                    <div
                      class="slds-p-around_small slds-text-color_weak slds-text-align_center"
                    >
                      No records found for "{recordSearchTerm}"
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Selected Records Pills Container -->
            <div class="slds-m-top_small">
              <template lwc:if={hasSelectedRecords}>
                <div
                  class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small"
                >
                  <span class="slds-text-title_bold slds-text-color_weak"
                    >Selected:</span
                  >
                  <button
                    class="slds-button slds-text-color_error slds-text-body_extra-small"
                    onclick={handleClearAllRecords}
                  >
                    Clear All
                  </button>
                </div>
                <div class="selected-pills-container">
                  <template for:each={selectedRecords} for:item="rec">
                    <span key={rec.id} class="custom-pill">
                      <lightning-icon
                        icon-name="standard:record"
                        size="xx-small"
                      ></lightning-icon>
                      <span
                        class="slds-truncate"
                        style="max-width: 140px"
                        title={rec.name}
                      >
                        {rec.name}
                      </span>
                      <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare"
                        size="x-small"
                        alternative-text="Remove"
                        data-id={rec.id}
                        onclick={handleRemoveRecord}
                      ></lightning-button-icon>
                    </span>
                  </template>
                </div>
              </template>
              <template lwc:else>
                <div
                  class="slds-text-body_extra-small slds-text-color_weak slds-p-around_x-small slds-text-align_center slds-border_dashed"
                >
                  Search & click to add records (multi-select supported)
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- Step 3: User Selector -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small"
        >
          <div class="selection-box">
            <div
              class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_x-small"
            >
              <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-icon
                  icon-name="utility:people"
                  size="x-small"
                  class="slds-m-right_x-small"
                ></lightning-icon>
                <span class="section-title">3. Select Users</span>
              </div>
              <template lwc:if={hasSelectedUsers}>
                <span class="slds-badge slds-theme_info"
                  >{selectedUsersCount} selected</span
                >
              </template>
            </div>

            <!-- User Search Input -->
            <div class="slds-is-relative">
              <lightning-input
                type="search"
                variant="label-hidden"
                placeholder="Search users by name or username..."
                value={userSearchTerm}
                oninput={handleUserSearchInput}
                onfocus={handleUserFocus}
                onblur={handleUserBlur}
                is-loading={isUserSearching}
              ></lightning-input>

              <template lwc:if={showUserDropdown}>
                <div class="dropdown-results">
                  <template lwc:if={userSearchResults.length}>
                    <template for:each={userSearchResults} for:item="u">
                      <div
                        key={u.id}
                        class="dropdown-item slds-grid slds-grid_vertical-align-center"
                        data-id={u.id}
                        onmousedown={handleSelectUser}
                      >
                        <lightning-icon
                          icon-name="standard:user"
                          size="small"
                          class="slds-m-right_small"
                        ></lightning-icon>
                        <div class="slds-col slds-truncate">
                          <div
                            class="slds-text-body_regular slds-truncate font-weight-600"
                          >
                            {u.name}
                          </div>
                          <div
                            class="slds-text-body_extra-small slds-text-color_weak"
                          >
                            {u.profileName} &bull; {u.username}
                          </div>
                        </div>
                      </div>
                    </template>
                  </template>
                  <template lwc:else>
                    <div
                      class="slds-p-around_small slds-text-color_weak slds-text-align_center"
                    >
                      No active users found for "{userSearchTerm}"
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Selected Users Pills Container -->
            <div class="slds-m-top_small">
              <template lwc:if={hasSelectedUsers}>
                <div
                  class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small"
                >
                  <span class="slds-text-title_bold slds-text-color_weak"
                    >Selected:</span
                  >
                  <button
                    class="slds-button slds-text-color_error slds-text-body_extra-small"
                    onclick={handleClearAllUsers}
                  >
                    Clear All
                  </button>
                </div>
                <div class="selected-pills-container">
                  <template for:each={selectedUsers} for:item="u">
                    <span key={u.id} class="custom-pill custom-pill-user">
                      <lightning-icon
                        icon-name="standard:user"
                        size="xx-small"
                      ></lightning-icon>
                      <span
                        class="slds-truncate"
                        style="max-width: 140px"
                        title={u.name}
                      >
                        {u.name}
                      </span>
                      <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare"
                        size="x-small"
                        alternative-text="Remove"
                        data-id={u.id}
                        onclick={handleRemoveUser}
                      ></lightning-button-icon>
                    </span>
                  </template>
                </div>
              </template>
              <template lwc:else>
                <div
                  class="slds-text-body_extra-small slds-text-color_weak slds-p-around_x-small slds-text-align_center slds-border_dashed"
                >
                  Search & click to add users (multi-select supported)
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Toolbar -->
      <div
        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_small slds-p-top_small slds-border_top"
      >
        <div class="slds-text-body_small slds-text-color_weak">
          <template lwc:if={isApplyDisabled}>
            <span class="slds-text-color_inverse-weak"
              >Please select at least one record and one user to check
              access.</span
            >
          </template>
          <template lwc:else>
            Ready to evaluate
            <strong>{selectedRecordsCount} record(s)</strong> across
            <strong>{selectedUsersCount} user(s)</strong>.
          </template>
        </div>
        <div class="slds-button-group" role="group">
          <lightning-button
            label="Reset"
            icon-name="utility:refresh"
            variant="neutral"
            onclick={handleReset}
          ></lightning-button>
          <lightning-button
            label="Apply"
            icon-name="utility:check"
            variant="brand"
            disabled={isApplyDisabled}
            onclick={handleApply}
          ></lightning-button>
        </div>
      </div>
    </div>

    <!-- Error Banner -->
    <template lwc:if={errorMessage}>
      <div class="slds-m-horizontal_medium slds-m-bottom_medium">
        <div
          class="slds-notify slds-notify_alert slds-theme_error"
          role="alert"
        >
          <span class="slds-assistive-text">error</span>
          <h2>{errorMessage}</h2>
        </div>
      </div>
    </template>

    <!-- Loading Spinner -->
    <template lwc:if={isLoading}>
      <div class="slds-p-around_large slds-is-relative" style="height: 200px">
        <lightning-spinner
          alternative-text="Evaluating record access..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Results Matrix Section -->
    <template lwc:if={hasResults}>
      <div class="slds-p-around_medium slds-border_top">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small slds-wrap"
        >
          <div
            class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
          >
            <lightning-icon
              icon-name="utility:matrix"
              size="small"
              class="slds-m-right_x-small"
            ></lightning-icon>
            <h2 class="slds-text-heading_small font-weight-700">
              Access Matrix Results
            </h2>
            <span class="slds-badge slds-m-left_small slds-theme_success">
              {totalFilteredCount} of {matrixRows.length} Records
            </span>
          </div>

          <!-- Pagination & In-Table Search Controls -->
          <div
            class="slds-grid slds-grid_vertical-align-center slds-wrap"
            style="gap: 0.5rem"
          >
            <div style="width: 220px">
              <lightning-input
                type="search"
                variant="label-hidden"
                placeholder="Filter evaluated records..."
                value={tableSearchTerm}
                onchange={handleTableSearchChange}
              ></lightning-input>
            </div>
            <div
              class="slds-grid slds-grid_vertical-align-center"
              style="gap: 0.35rem"
            >
              <span class="slds-text-body_small slds-text-color_weak"
                >Show:</span
              >
              <lightning-combobox
                variant="label-hidden"
                value={pageSize}
                options={pageSizeOptions}
                onchange={handlePageSizeChange}
                style="width: 80px"
              ></lightning-combobox>
              <lightning-button-icon
                icon-name="utility:chevronleft"
                variant="border-filled"
                size="small"
                alternative-text="Previous Page"
                disabled={isFirstPage}
                onclick={handlePrevPage}
              ></lightning-button-icon>
              <span
                class="slds-text-body_small slds-text-color_weak slds-p-horizontal_xx-small"
              >
                {currentPage} / {totalPages}
              </span>
              <lightning-button-icon
                icon-name="utility:chevronright"
                variant="border-filled"
                size="small"
                alternative-text="Next Page"
                disabled={isLastPage}
                onclick={handleNextPage}
              ></lightning-button-icon>
            </div>
            <lightning-button
              label="Export CSV"
              icon-name="utility:download"
              variant="neutral"
              size="small"
              onclick={handleExportMatrixCsv}
            ></lightning-button>
          </div>
        </div>

        <div class="matrix-table-container">
          <table class="matrix-table slds-table_bordered">
            <thead>
              <!-- Top Header Row -->
              <tr>
                <th
                  class="record-col-header"
                  rowspan="2"
                  style="width: 70px; text-align: center"
                >
                  Actions
                </th>
                <th
                  class="record-col-header"
                  rowspan="2"
                  style="min-width: 180px"
                >
                  Record Name
                </th>
                <th
                  class="record-col-header"
                  rowspan="2"
                  style="min-width: 110px"
                >
                  sObject
                </th>
                <th
                  class="record-col-header"
                  rowspan="2"
                  style="min-width: 140px"
                >
                  Record ID
                </th>
                <template for:each={matrixUsers} for:item="u">
                  <th
                    key={u.userId}
                    colspan="2"
                    style="
                      min-width: 160px;
                      text-align: center;
                      border-left: 2px solid #94a3b8;
                    "
                  >
                    <div class="slds-truncate">
                      <a
                        href={u.setupUserUrl}
                        target="_blank"
                        rel="noreferrer"
                        class="user-header-link"
                        title="Open User Setup in Salesforce"
                      >
                        {u.userName}
                      </a>
                    </div>
                    <div
                      class="slds-badge slds-m-top_xx-small"
                      style="font-size: 0.68rem; font-weight: normal"
                    >
                      {u.profileName}
                    </div>
                  </th>
                </template>
              </tr>
              <!-- Sub-header Row for Read & Edit -->
              <tr>
                <template for:each={matrixUsers} for:item="u">
                  <th
                    key={u.readKey}
                    style="
                      width: 80px;
                      text-align: center;
                      border-left: 2px solid #94a3b8;
                      background: #e2e8f0;
                      font-size: 0.75rem;
                    "
                  >
                    Read
                  </th>
                  <th
                    key={u.editKey}
                    style="
                      width: 80px;
                      text-align: center;
                      background: #e2e8f0;
                      font-size: 0.75rem;
                    "
                  >
                    Edit
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={paginatedRows} for:item="row">
                <tr key={row.recordId}>
                  <!-- Actions: Sharing Details & Quick Grant Share -->
                  <td style="text-align: center; white-space: nowrap">
                    <lightning-button-icon
                      icon-name="utility:info"
                      variant="bare"
                      alternative-text="View Sharing Details"
                      title="View Detailed Sharing Analysis"
                      data-record-id={row.recordId}
                      onclick={handleOpenDetails}
                    ></lightning-button-icon>
                    <lightning-button-icon
                      icon-name="utility:share"
                      variant="bare"
                      alternative-text="Grant Manual Share"
                      title="Grant Manual Share to User"
                      class="slds-m-left_xx-small"
                      data-record-id={row.recordId}
                      data-record-name={row.recordName}
                      onclick={handleOpenGrantFromRow}
                    ></lightning-button-icon>
                  </td>
                  <!-- Record Name with Deep Link -->
                  <td class="font-weight-600">
                    <a
                      href={row.recordUrl}
                      target="_blank"
                      rel="noreferrer"
                      class="record-link slds-truncate"
                      title={row.recordName}
                    >
                      {row.recordName}
                    </a>
                  </td>
                  <!-- sObject -->
                  <td>
                    <span class="slds-badge slds-badge_lightest"
                      >{row.sObjectLabel}</span
                    >
                  </td>
                  <!-- Record ID -->
                  <td>
                    <span class="mono-font slds-text-color_weak"
                      >{row.recordId}</span
                    >
                  </td>
                  <!-- User Access Cells (Read & Edit) -->
                  <template for:each={row.cells} for:item="cell">
                    <!-- Read Cell -->
                    <td
                      key={cell.readKey}
                      class="access-cell"
                      style="border-left: 2px solid #e2e8f0"
                    >
                      <template lwc:if={cell.hasReadAccess}>
                        <span
                          class="access-badge-true"
                          title="User has Read Access"
                        >
                          <lightning-icon
                            icon-name="utility:check"
                            size="xx-small"
                            variant="success"
                          ></lightning-icon>
                        </span>
                      </template>
                      <template lwc:else>
                        <span class="access-badge-false" title="No Read Access">
                          <lightning-icon
                            icon-name="utility:close"
                            size="xx-small"
                            variant="error"
                          ></lightning-icon>
                        </span>
                      </template>
                    </td>
                    <!-- Edit Cell -->
                    <td key={cell.editKey} class="access-cell">
                      <template lwc:if={cell.hasEditAccess}>
                        <span
                          class="access-badge-true"
                          title="User has Edit Access"
                        >
                          <lightning-icon
                            icon-name="utility:check"
                            size="xx-small"
                            variant="success"
                          ></lightning-icon>
                        </span>
                      </template>
                      <template lwc:else>
                        <span class="access-badge-false" title="No Edit Access">
                          <lightning-icon
                            icon-name="utility:close"
                            size="xx-small"
                            variant="error"
                          ></lightning-icon>
                        </span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>

    <!-- Empty State / Instructions when not yet evaluated -->
    <template lwc:if={hasNoResults}>
      <div
        class="slds-p-around_large slds-text-align_center slds-text-color_weak"
      >
        <lightning-icon
          icon-name="utility:warning"
          size="medium"
          class="slds-m-bottom_small"
        ></lightning-icon>
        <p class="slds-text-heading_small">
          No records or users could be evaluated.
        </p>
      </div>
    </template>
  </div>

  <!-- Detailed Sharing Analysis Modal -->
  <template lwc:if={isModalOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      class="slds-modal slds-fade-in-open slds-modal_medium"
    >
      <div class="slds-modal__container">
        <!-- Modal Header -->
        <header
          class="slds-modal__header modal-header-banner slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
        >
          <div>
            <h2
              class="slds-text-heading_medium"
              style="color: #ffffff; font-weight: 700"
            >
              Record Sharing & Access Analysis
            </h2>
            <p
              class="slds-m-top_xx-small"
              style="color: #cbd5e1; font-size: 0.82rem"
            >
              Comprehensive breakdown of how each user obtains Read/Edit access.
            </p>
          </div>
          <lightning-button-icon
            icon-name="utility:close"
            variant="bare-inverse"
            size="large"
            alternative-text="Close modal"
            onclick={handleCloseModal}
          ></lightning-button-icon>
        </header>

        <!-- Modal Body -->
        <div
          class="slds-modal__content slds-p-around_medium"
          style="max-height: 70vh; overflow-y: auto"
        >
          <template lwc:if={isModalLoading}>
            <div
              class="slds-p-around_xx-large slds-is-relative"
              style="height: 180px"
            >
              <lightning-spinner
                alternative-text="Analyzing record sharing..."
                size="medium"
              ></lightning-spinner>
            </div>
          </template>

          <template lwc:if={modalData}>
            <!-- Record Summary Strip -->
            <div class="summary-strip slds-m-bottom_medium">
              <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                  <div class="slds-text-color_weak slds-text-body_extra-small">
                    Record Name:
                  </div>
                  <div class="slds-text-title_bold slds-truncate">
                    {modalData.recordName}
                  </div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                  <div class="slds-text-color_weak slds-text-body_extra-small">
                    sObject:
                  </div>
                  <div class="slds-text-title_bold">
                    {modalData.sObjectLabel} ({modalData.sObjectName})
                  </div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                  <div class="slds-text-color_weak slds-text-body_extra-small">
                    Record Owner:
                  </div>
                  <div class="slds-text-title_bold">{modalData.ownerName}</div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                  <div class="slds-text-color_weak slds-text-body_extra-small">
                    Org-Wide Default (OWD):
                  </div>
                  <span class="slds-badge slds-theme_info"
                    >{modalData.internalSharingModel}</span
                  >
                </div>
              </div>
            </div>

            <!-- User Explanations List -->
            <h3
              class="slds-text-title_bold slds-m-bottom_small slds-text-color_weak"
              style="text-transform: uppercase; letter-spacing: 0.5px"
            >
              User Access Breakdown
            </h3>

            <template for:each={modalData.userExplanations} for:item="userExp">
              <div key={userExp.userId} class="user-sharing-card">
                <div class="user-sharing-card-header">
                  <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-icon
                      icon-name="standard:user"
                      size="small"
                      class="slds-m-right_small"
                    ></lightning-icon>
                    <div>
                      <span class="slds-text-title_bold slds-m-right_x-small"
                        >{userExp.userName}</span
                      >
                      <span class="slds-badge slds-badge_lightest"
                        >{userExp.profileName}</span
                      >
                    </div>
                  </div>
                  <div>
                    <span class={userExp.badgeClass}>
                      Overall: {userExp.overallAccess}
                    </span>
                    <lightning-button
                      label="Grant Share"
                      icon-name="utility:share"
                      variant="neutral"
                      size="small"
                      class="slds-m-left_small"
                      data-user-id={userExp.userId}
                      data-user-name={userExp.userName}
                      data-record-id={modalData.recordId}
                      data-record-name={modalData.recordName}
                      onclick={handleOpenGrantFromModal}
                    ></lightning-button>
                  </div>
                </div>

                <!-- Reasons Table for this User -->
                <table class="reason-table">
                  <thead>
                    <tr>
                      <th style="width: 25%">Access Source</th>
                      <th style="width: 20%">Access Level</th>
                      <th style="width: 43%">Explanation / Details</th>
                      <th style="width: 12%; text-align: center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={userExp.reasons} for:item="reason">
                      <tr key={reason.key}>
                        <td>
                          <span
                            class="slds-badge slds-theme_shade"
                            style="font-size: 0.75rem"
                          >
                            {reason.category}
                          </span>
                        </td>
                        <td class="font-weight-600">{reason.accessLevel}</td>
                        <td class="slds-text-color_default">
                          {reason.details}
                        </td>
                        <td style="text-align: center">
                          <template lwc:if={reason.isManualShare}>
                            <lightning-button
                              label="Revoke"
                              icon-name="utility:delete"
                              variant="destructive"
                              size="x-small"
                              data-user-id={userExp.userId}
                              data-record-id={modalData.recordId}
                              data-sobject={modalData.sObjectName}
                              onclick={handleRevokeShare}
                            ></lightning-button>
                          </template>
                          <template lwc:else>
                            <span
                              class="slds-text-body_extra-small slds-text-color_weak"
                              >-</span
                            >
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </template>
        </div>

        <!-- Modal Footer -->
        <footer class="slds-modal__footer slds-grid slds-grid_align-end">
          <lightning-button
            label="Close"
            variant="neutral"
            onclick={handleCloseModal}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Grant Manual Share Modal Dialog -->
  <template lwc:if={isGrantModalOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      class="slds-modal slds-fade-in-open slds-modal_small"
      style="z-index: 9999"
    >
      <div class="slds-modal__container">
        <header
          class="slds-modal__header modal-header-banner slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
        >
          <div>
            <h2
              class="slds-text-heading_medium"
              style="color: #ffffff; font-weight: 700"
            >
              Grant Manual Share
            </h2>
            <p
              class="slds-m-top_xx-small"
              style="color: #cbd5e1; font-size: 0.82rem"
            >
              Explicitly grant Read or Read/Write access for this record to a
              specific user.
            </p>
          </div>
          <lightning-button-icon
            icon-name="utility:close"
            variant="bare-inverse"
            size="large"
            alternative-text="Close"
            onclick={handleCloseGrantModal}
          ></lightning-button-icon>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <div class="slds-form slds-form_stacked">
            <div class="slds-form-element slds-m-bottom_small">
              <label class="slds-form-element__label font-weight-700"
                >Record</label
              >
              <div class="slds-form-element__control">
                <div
                  class="slds-box slds-box_x-small"
                  style="background: #f8fafc"
                >
                  <strong>{grantRecordName}</strong>
                  <span class="slds-m-left_small mono-font slds-text-color_weak"
                    >{grantRecordId}</span
                  >
                </div>
              </div>
            </div>

            <div class="slds-form-element slds-m-bottom_small">
              <lightning-combobox
                name="grantUserPicker"
                label="Target User"
                value={grantUserId}
                placeholder="Select user to grant access..."
                options={grantUserOptions}
                onchange={handleGrantUserChange}
                required
              ></lightning-combobox>
            </div>

            <div class="slds-form-element slds-m-bottom_small">
              <lightning-combobox
                name="grantAccessLevelPicker"
                label="Access Level"
                value={grantAccessLevel}
                options={grantAccessLevelOptions}
                onchange={handleGrantAccessLevelChange}
                required
              ></lightning-combobox>
            </div>
          </div>
        </div>

        <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
          <lightning-button
            label="Cancel"
            variant="neutral"
            onclick={handleCloseGrantModal}
          ></lightning-button>
          <lightning-button
            label="Grant Share"
            icon-name="utility:check"
            variant="brand"
            disabled={isGrantSubmitDisabled}
            onclick={handleExecuteGrantShare}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" style="z-index: 9998"></div>
  </template>
</template>
