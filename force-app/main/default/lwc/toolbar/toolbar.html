<template>
  <div class="slds-page-header">
    <div class="slds-page-header__row">
      <div class="slds-page-header__col-title">
        <div class="slds-page-header__name">
          <div class="slds-page-header__name-title">
            <h1>
              <span
                class="slds-page-header__title slds-truncate"
                title={pageTitle}
                >{pageTitle}</span
              >
            </h1>
          </div>
        </div>
      </div>
      <div class="slds-page-header__col-actions">
        <div class="slds-page-header__controls">
          <div class="slds-page-header__control">
            <lightning-input
              variant="label-hidden"
              type="search"
              placeholder={searchPlaceholderText}
              min-length={minInputLength}
              oncommit={handleInputChange}
              onchange={handleInputChange}
            ></lightning-input>
          </div>
          <div class="slds-page-header__control">
            <div class="slds-is-relative">
              <lightning-button-icon-stateful
                icon-name="utility:filterList"
                selected={isFilterPanelOpen}
                onclick={handleFilterButtonClick}
                alternative-text={labels.common_label_filter}
              ></lightning-button-icon-stateful>
              <div
                lwc:if={isFilterPanelOpen}
                class="slds-is-absolute popover-placement"
              >
                <c-filter-panel
                  filter-values={filterValues}
                  onapply={handleApply}
                  onclear={handleClear}
                  onreset={handleReset}
                  onfilterchange={handleFilterChange}
                ></c-filter-panel>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="slds-page-header__row">
      <div class="slds-page-header__col-meta">
        <div class="slds-page-header__meta-text">
          <span class="slds-list_horizontal slds-wrap slds-has-dividers_right">
            <template for:each={subTitleList} for:item="subTitle">
              <span key={subTitle} class="slds-item divider-adjust"
                >{subTitle}</span
              >
            </template>
          </span>
        </div>
      </div>
      <div class="slds-page-header__col-controls">
        <div class="slds-page-header__controls"></div>
      </div>
    </div>
  </div>
</template>
