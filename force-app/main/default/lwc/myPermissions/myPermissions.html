<template>
  <div style="position: relative">
    <lightning-spinner
      lwc:if={isLoading}
      alternative-text={labels.common_label_loading}
      size="medium"
      variant="base"
    ></lightning-spinner>

    <div lwc:if={error}>
      <c-illustration
        title={labels.permissions_label_error_failed_to_fatch_current_user_details}
        sub-title={error}
      ></c-illustration>
    </div>

    <div lwc:else class="slds-grid slds-grid_vertical">
      <c-toolbar
        title="My Permissions"
        filter-values={currentFilters}
        onsearch={handleSearch}
        onfilterchange={handleFilterChange}
        onapply={handleApply}
        onclear={handleClear}
        onreset={handleReset}
      ></c-toolbar>

      <c-all-permissions
        profile-ids={appliedProfileIds}
        permission-set-ids={appliedPermissionSetIds}
        search-term={searchTerm}
      ></c-all-permissions>
    </div>
  </div>
</template>
