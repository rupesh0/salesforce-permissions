<template>
  <div class="slds-m-top_medium">
    <!-- Empty state when no permissions are selected -->
    <div
      lwc:if={isNoneVisible}
      class="slds-card slds-p-around_large slds-text-align_center slds-m-bottom_medium"
    >
      <p class="slds-text-heading_small slds-text-color_weak">
        No permissions selected. Check one or more boxes above to view
        permissions.
      </p>
    </div>

    <!-- Object & Field Permissions -->
    <div
      lwc:if={isObjectVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Object & Field Permissions
      </h2>
      <c-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-permissions>
    </div>

    <!-- System Permissions -->
    <div
      lwc:if={isSystemVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        System Permissions
      </h2>
      <c-system-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-system-permissions>
    </div>

    <!-- App Permissions -->
    <div
      lwc:if={isAppsVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        App Permissions
      </h2>
      <c-app-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-app-permissions>
    </div>

    <!-- Apex Class Access -->
    <div
      lwc:if={isApexClassVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Apex Class Access
      </h2>
      <c-apex-class-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-apex-class-permissions>
    </div>

    <!-- Visualforce Page Access -->
    <div
      lwc:if={isVfPageVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Visualforce Page Access
      </h2>
      <c-vf-page-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-vf-page-permissions>
    </div>

    <!-- Custom Setting Definitions -->
    <div
      lwc:if={isCustomSettingsVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Custom Setting Definitions
      </h2>
      <c-custom-settings
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-custom-settings>
    </div>

    <!-- Custom Metadata Types -->
    <div
      lwc:if={isCustomMetadataVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Custom Metadata Types
      </h2>
      <c-custom-metadata-types
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-custom-metadata-types>
    </div>

    <!-- Flow Access -->
    <div
      lwc:if={isFlowVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">Flow Access</h2>
      <c-flow-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-flow-permissions>
    </div>

    <!-- Named Credential Access -->
    <div
      lwc:if={isNamedCredentialsVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Named Credential Access
      </h2>
      <c-named-credentials
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-named-credentials>
    </div>

    <!-- Organization-Wide Email Address Access -->
    <div
      lwc:if={isOrgWideEmailVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Organization-Wide Email Address Access
      </h2>
      <c-org-wide-email-address-access
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-org-wide-email-address-access>
    </div>

    <!-- Standard Invocable Action Type Access -->
    <div
      lwc:if={isInvocableActionsVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Standard Invocable Action Type Access
      </h2>
      <c-standard-invocable-action-access
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-standard-invocable-action-access>
    </div>

    <!-- Service Providers -->
    <div
      lwc:if={isServiceProvidersVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Service Providers
      </h2>
      <c-service-providers
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-service-providers>
    </div>

    <!-- Assigned Apps -->
    <div
      lwc:if={isAssignedAppsVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Assigned Apps
      </h2>
      <c-assigned-app-permissions
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-assigned-app-permissions>
    </div>

    <!-- Assigned Connected Apps -->
    <div
      lwc:if={isConnectedAppsVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        Assigned Connected Apps
      </h2>
      <c-assigned-connected-app
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-assigned-connected-app>
    </div>

    <!-- External Data Sources -->
    <div
      lwc:if={isDataSourcesVisible}
      class="slds-card slds-m-bottom_medium slds-p-around_medium"
    >
      <h2 class="slds-text-heading_medium slds-m-bottom_small">
        External Data Sources
      </h2>
      <c-external-data-sources
        profile-ids={profileIds}
        permission-set-ids={permissionSetIds}
        search-term={searchTerm}
      ></c-external-data-sources>
    </div>
  </div>
</template>
